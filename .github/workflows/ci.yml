name: CI - Build & Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Lint & Test (api + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm --filter @pet360/api exec prisma generate

      - name: Lint api
        run: pnpm --filter @pet360/api lint

      - name: Lint web
        run: pnpm --filter @pet360/web lint

      - name: Test api
        run: pnpm --filter @pet360/api test

      - name: Build shared package
        run: pnpm --filter @pet360/shared build

      - name: Build api
        run: pnpm --filter @pet360/api build

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        run: pnpm --filter @pet360/web build

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t pet360-api:ci .

      - name: Build Web image
        run: >
          docker build -f apps/web/Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:3001
          -t pet360-web:ci .
